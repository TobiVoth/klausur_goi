services:
  klausurtrainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mc-klausur-trainer
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    restart: unless-stopped
